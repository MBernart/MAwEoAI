name: Build
on:
  push:
    branches:
      - "**"
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build StarWars
        run: |
          xcodebuild \
            -project StarWars.xcodeproj \
            -scheme StarWars \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name "StarWars.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Built app bundle was not found."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" StarWars.app.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarWars-app
          path: StarWars.app.zip
